<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Tap2Protect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FB06C"/><stop offset="1" stop-color="#0E5B34"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1E4B4"/><stop offset="1" stop-color="#E4D19A"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="30" fill="url(#bg)"/>
  <!-- shield -->
  <path d="M60 22 L92 33 C92 62, 84 87, 60 100 C36 87, 28 62, 28 33 Z" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
  <!-- leaf -->
  <path d="M60 40 C74 48, 76 68, 60 86 C44 68, 46 48, 60 40 Z" fill="url(#leaf)"/>
  <path d="M60 45 L60 82" stroke="#0E5B34" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
  <path d="M60 58 C55 55, 52 54, 49 53 M60 66 C65 63, 68 62, 71 61" stroke="#0E5B34" stroke-width="2" fill="none" stroke-linecap="round" opacity=".45"/>
  <!-- tap ripple (upper-right) -->
  <circle cx="88" cy="32" r="5.2" fill="#F1E4B4"/>
  <path d="M96 24 A11 11 0 0 1 96 40" fill="none" stroke="#F1E4B4" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  <path d="M101 19 A18 18 0 0 1 101 45" fill="none" stroke="#F1E4B4" stroke-width="3" stroke-linecap="round" opacity=".55"/>
</svg>
